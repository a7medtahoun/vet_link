<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#fffdf9">
  <meta name="description" content="Follow Vet Link on social media for the latest about your furry friends.">
  <title>Vet Link | Follow us</title>
  <link rel="stylesheet" href="style/style.css">
</head>
<body>
  <main class="page-card">
    <header class="brand" aria-label="Vet Link">
      <img class="logo" src="assets\logo.png" alt="Vet Link logo">
      <span class="brand-name">VET</span>
      <span class="brand-link">L I N K</span>
    </header>

    <section class="intro" aria-labelledby="page-title">
      <h1 id="page-title">Follow us on social media</h1>
      <p>Every update about your furry friends</p>
      <span class="accent-line" aria-hidden="true"></span>
    </section>

    <nav class="social-links" aria-label="Social media links">
      <a
        class="social-card"
        href="https://www.tiktok.com/@vet.link?_r=1&amp;_t=ZS-9BVaaGgKfZM"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Vet Link on TikTok"
      >
        <span class="chevron" aria-hidden="true">‹</span>
        <span class="social-copy">
          <strong>TikTok</strong>
          <span>@vet.link</span>
        </span>
        <span class="social-icon tiktok" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M16.6 5.1c-.7-.8-1.1-1.9-1.1-3.1h-3.8v14.2a2.7 2.7 0 1 1-2.7-2.7c.4 0 .8.1 1.1.2V9.8a7 7 0 1 0 5.4 6.8V9.4a9 9 0 0 0 5.2 1.7V7.3c-1.6 0-3.1-.8-4.1-2.2Z"/>
          </svg>
        </span>
      </a>

      <a
        class="social-card"
        href="https://www.facebook.com/profile.php?id=61575236639007&amp;mibextid=ZbWKwL"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Vet Link on Facebook"
      >
        <span class="chevron" aria-hidden="true">‹</span>
        <span class="social-copy">
          <strong>Facebook</strong>
          <span>Vet Link</span>
        </span>
        <span class="social-icon facebook" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <path d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H7.3V13h2.8v8h3.4Z"/>
          </svg>
        </span>
      </a>

      <a
        class="social-card"
        href="https://www.instagram.com/vetlink2027?hvrq=MTEzeXF0b2ZqNzg3Nw=="
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Vet Link on Instagram"
      >
        <span class="chevron" aria-hidden="true">‹</span>
        <span class="social-copy">
          <strong>Instagram</strong>
          <span>@vetlink2027</span>
        </span>
        <span class="social-icon instagram" aria-hidden="true">
          <svg viewBox="0 0 24 24">
            <rect x="3.2" y="3.2" width="17.6" height="17.6" rx="5"/>
            <circle cx="12" cy="12" r="4.1"/>
            <circle class="insta-dot" cx="17.7" cy="6.5" r="1.1"/>
          </svg>
        </span>
      </a>
    </nav>

    <footer>
      Vet Link
      <span class="made-with-love">
        Made with love <span aria-hidden="true">♥</span>
      </span>
    </footer>
  </main>
</body>
</html>
